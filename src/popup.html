<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Label Studio Auto-Fill</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        width: 280px;
        margin: 0;
        padding: 14px 16px;
        color: #1f1f1f;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 8px 0;
        font-size: 13px;
      }
      .row label {
        flex: 1;
      }
      button {
        width: 100%;
        margin-top: 10px;
        padding: 8px;
        border: 1px solid #1677ff;
        background: #1677ff;
        color: white;
        border-radius: 4px;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover {
        background: #0958d9;
      }
      .status {
        margin-top: 10px;
        padding: 8px;
        background: #f5f5f5;
        border-radius: 4px;
        font-size: 12px;
        line-height: 1.4;
      }
      .status .ok {
        color: #389e0d;
      }
      .status .miss {
        color: #cf1322;
      }
      .progress {
        margin-top: 10px;
        padding: 8px;
        background: #e6f4ff;
        border: 1px solid #91caff;
        border-radius: 4px;
        font-size: 12px;
        line-height: 1.6;
      }
      .progress-bar-wrap {
        background: #d0e8ff;
        border-radius: 3px;
        height: 6px;
        margin-top: 6px;
      }
      .progress-bar {
        background: #1677ff;
        height: 6px;
        border-radius: 3px;
        transition: width 0.3s;
      }
    </style>
  </head>
  <body>
    <h1>Label Studio Auto-Fill</h1>

    <div class="row">
      <label for="enabled">Auto-fill al cambiar de tarea</label>
      <input type="checkbox" id="enabled" />
    </div>
    <div class="row">
      <label for="autoSubmit">Enviar automáticamente (Submit)</label>
      <input type="checkbox" id="autoSubmit" />
    </div>

    <div class="row task-row">
      <label>Tarea actual</label>
      <input type="number" id="currentTask" min="1" max="9999" style="width:58px;padding:3px 5px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;">
      <span style="color:#888">de</span>
      <input type="number" id="totalTasks" min="1" max="9999" style="width:58px;padding:3px 5px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;">
    </div>

    <button id="fill-now">Rellenar ahora</button>

    <div class="progress" id="progress" style="display:none"></div>

    <div class="status" id="status">Cargando…</div>

    <script src="popup.js"></script>
  </body>
</html>
